<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0d1b27">
  <title>Sign Scope of Appointment | Platinum Financial</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#eef3f5;color:#12202a;font:15px/1.45 Arial,sans-serif}.wrap{width:min(900px,calc(100% - 24px));margin:24px auto}.card{background:#fff;border:1px solid #dbe3e7;border-radius:16px;box-shadow:0 14px 45px rgba(20,45,60,.12);overflow:hidden}.head{display:flex;align-items:center;gap:13px;padding:18px 20px;background:#0d1b27;color:#fff}.head img{width:54px;height:54px;border-radius:9px;object-fit:cover}.head h1{margin:0;font-size:1.35rem}.head p{margin:3px 0 0;color:#d7e3ea;font-size:.85rem}.body{display:grid;gap:17px;padding:20px}.notice{padding:12px;border-radius:9px;background:#eff7fb;border:1px solid #c5dce9}.notice.error{background:#fff0f0;border-color:#efc4c4;color:#8c2828}.client{display:grid;gap:4px;padding:13px;border-radius:10px;background:#f6f8f9;border:1px solid #dbe3e7}.client span{color:#536875;font-size:.86rem}.appointment{display:grid;grid-template-columns:1fr 1fr;gap:10px}.appointment div{padding:11px;border:1px solid #dbe3e7;border-radius:9px;background:#fffaf0}.appointment strong,.appointment span{display:block}.appointment span{font-size:.86rem;color:#536875;margin-top:3px}.products{display:grid;grid-template-columns:1fr 1fr;gap:8px;border:1px solid #dbe3e7;border-radius:12px;padding:13px}.products legend{font-weight:800;padding:0 5px}.products label{display:flex;align-items:flex-start;gap:8px;padding:9px;border:1px solid #e1e8eb;border-radius:8px;background:#f8fafb}.ack{padding:13px;border:1px solid #244459;border-radius:10px;background:#0d1b27;color:#fff}.ack p{margin:8px 0 0}.ack label{display:flex;align-items:flex-start;gap:8px;margin-top:12px;font-weight:800}.signature{display:grid;gap:8px}.signature canvas{width:100%;height:210px;touch-action:none;border:2px solid #94a9b6;border-radius:10px;background:#fff}.actions{display:flex;justify-content:flex-end;gap:9px;flex-wrap:wrap}.btn{border:1px solid #244459;border-radius:9px;padding:10px 15px;font-weight:800;cursor:pointer}.btn.primary{background:#123a52;color:#fff}.btn.secondary{background:#fff;color:#18384b}.btn:disabled{opacity:.55;cursor:wait}.success{text-align:center;padding:36px 20px}.success h2{color:#17633d}@media(max-width:650px){.products,.appointment{grid-template-columns:1fr}.wrap{margin:10px auto;width:calc(100% - 12px)}.body{padding:14px}.signature canvas{height:180px}.actions .btn{flex:1}}
  </style>
</head>
<body>
<div class="wrap"><main class="card" id="app"><div class="head"><img src="/assets/mh-logo.jpg" alt="M&amp;H"><div><h1>Platinum Financial</h1><p>Secure Scope of Appointment</p></div></div><div class="body"><div class="notice">Loading your secure signing request…</div></div></main></div>
<script>
const ENDPOINT='https://sggzshbdfgkyyvxbebul.supabase.co/functions/v1/soa-sign';
const token=new URLSearchParams(location.search).get('token')||'';
const app=document.querySelector('#app');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const prettyDate=value=>{if(!value)return'Not provided';const d=new Date(`${String(value).slice(0,10)}T12:00:00`);return Number.isNaN(+d)?String(value):d.toLocaleDateString()};
function wrapText(ctx,text,x,y,maxWidth,lineHeight){const words=String(text||'').split(/\s+/).filter(Boolean);let line='',cy=y;for(const word of words){const test=line?`${line} ${word}`:word;if(ctx.measureText(test).width>maxWidth&&line){ctx.fillText(line,x,cy);line=word;cy+=lineHeight}else line=test}if(line)ctx.fillText(line,x,cy);return cy+lineHeight}
function point(canvas,e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*(canvas.width/r.width),y:(e.clientY-r.top)*(canvas.height/r.height)}}
async function buildPng(data,canvas){const out=document.createElement('canvas');out.width=1400;out.height=2400;const ctx=out.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,out.width,out.height);ctx.fillStyle='#0f172a';ctx.font='bold 48px Arial';ctx.fillText('Platinum Financial',90,110);ctx.font='bold 38px Arial';ctx.fillText('Scope of Sales Appointment Confirmation',90,175);const signed=new Date();ctx.font='22px Arial';ctx.fillStyle='#475569';ctx.fillText(`Appointment date: ${data.appointment_date||'Not provided'}`,90,225);ctx.fillText(`Coverage year: ${data.coverage_year||'Not provided'}`,90,263);ctx.fillText(`SOA signed: ${signed.toLocaleString()}`,90,301);ctx.fillStyle='#0f172a';ctx.font='22px Arial';let y=356;y=wrapText(ctx,'This Scope of Appointment documents the Medicare and health-related product types the beneficiary requested to discuss with the agent named below for the stated coverage year.',90,y,1210,32)+18;y=wrapText(ctx,'Signing this form does not obligate the beneficiary to enroll, does not affect current or future Medicare enrollment status, and does not automatically enroll the beneficiary in any plan.',90,y,1210,32)+28;ctx.font='bold 28px Arial';ctx.fillText('Beneficiary',90,y);y+=44;ctx.font='24px Arial';ctx.fillText(`Name: ${data.beneficiary_name||'Client'}`,90,y);y+=38;ctx.fillText(`Phone: ${data.beneficiary_phone||'Not provided'}`,90,y);y+=38;y=wrapText(ctx,`Address: ${data.beneficiary_address||'Not provided'}`,90,y,1210,34)+20;ctx.font='bold 28px Arial';ctx.fillText('Agent',90,y);y+=44;ctx.font='24px Arial';ctx.fillText(`Name: ${data.agent_name||'Platinum Financial Agent'}`,90,y);y+=38;ctx.fillText(`Phone: ${data.agent_phone||'Not provided'}`,90,y);y+=58;ctx.font='bold 28px Arial';ctx.fillText('Products requested for discussion',90,y);y+=44;ctx.font='24px Arial';const products=[...(data.products||[])];if(data.other_product)products.push(data.other_product);products.forEach(p=>{ctx.fillText(`• ${p}`,110,y);y+=36});y+=26;ctx.font='bold 28px Arial';ctx.fillText('Beneficiary acknowledgement',90,y);y+=44;ctx.font='24px Arial';y=wrapText(ctx,'By signing below, I confirm that I requested discussion of the product types listed above for the stated coverage year. I understand that signing does not obligate me to enroll, does not affect my current or future Medicare enrollment status, and does not automatically enroll me in any plan.',90,y,1210,36)+15;y=wrapText(ctx,'The agent may discuss only the product types agreed to on this Scope of Appointment. If I request discussion of a different product type or a different coverage year, an updated or new Scope of Appointment must be documented before that additional discussion.',90,y,1210,36)+30;ctx.font='bold 26px Arial';ctx.fillText('Beneficiary signature',90,y);y+=24;ctx.strokeStyle='#cbd5e1';ctx.strokeRect(90,y,1210,300);ctx.drawImage(canvas,110,y+20,1170,260);y+=345;ctx.font='22px Arial';ctx.fillStyle='#475569';ctx.fillText(`Signed electronically: ${signed.toLocaleString()}`,90,y);y+=40;ctx.font='18px Arial';ctx.fillText('Generated and stored securely by Platinum Financial CRM. Compliance retention: 10 years from signature.',90,y);return new Promise((res,rej)=>out.toBlob(b=>b?res(b):rej(new Error('Could not create signed document.')),'image/png'))}
async function blobBase64(blob){return new Promise((res,rej)=>{const reader=new FileReader();reader.onload=()=>res(String(reader.result).split(',')[1]||'');reader.onerror=()=>rej(reader.error);reader.readAsDataURL(blob)})}
async function load(){if(!token){showError('This signing link is invalid.');return}try{const response=await fetch(`${ENDPOINT}?token=${encodeURIComponent(token)}`,{cache:'no-store'});const result=await response.json();if(!response.ok)throw new Error(result.error||'Unable to load signing request.');if(result.status==='signed'){showSigned();return}render(result.request||{})}catch(e){showError(e.message||'Unable to load signing request.')}}
function header(){return'<div class="head"><img src="/assets/mh-logo.jpg" alt="M&H"><div><h1>Platinum Financial</h1><p>Secure Scope of Appointment</p></div></div>'}
function showError(message){app.innerHTML=`${header()}<div class="body"><div class="notice error">${esc(message)}</div></div>`}
function showSigned(){app.innerHTML=`${header()}<div class="success"><h2>Scope of Appointment already signed</h2><p>Thank you. No further action is needed.</p></div>`}
function render(data){const products=[...(data.products||[])];if(data.other_product)products.push(data.other_product);app.innerHTML=`${header()}<div class="body"><div class="client"><strong>${esc(data.beneficiary_name||'Client')}</strong><span>${esc(data.beneficiary_phone||'')}</span><span>${esc(data.beneficiary_address||'')}</span><span>Agent: ${esc(data.agent_name||'Platinum Financial Agent')}</span></div><div class="appointment"><div><strong>Appointment Date</strong><span>${esc(prettyDate(data.appointment_date))}</span></div><div><strong>Coverage Year</strong><span>${esc(data.coverage_year||'Not provided')}</span></div></div><fieldset class="products"><legend>Products requested for discussion</legend>${products.map(p=>`<label><input type="checkbox" checked disabled> ${esc(p)}</label>`).join('')}</fieldset><div class="ack"><strong>Beneficiary acknowledgement</strong><p>By signing below, I confirm that I requested discussion of the product types shown above for the stated coverage year. I understand that signing does not obligate me to enroll, does not affect my current or future Medicare enrollment status, and does not automatically enroll me in any plan.</p><p>The agent may discuss only the product types agreed to on this Scope of Appointment. If I request discussion of a different product type or a different coverage year, an updated or new Scope of Appointment must be documented before that additional discussion.</p><label><input type="checkbox" id="agree"> <span>I have reviewed and agree to the acknowledgement above.</span></label></div><div class="signature"><strong>Beneficiary Signature</strong><canvas id="sig" width="1000" height="260"></canvas><div><button type="button" class="btn secondary" id="clear">Clear Signature</button></div></div><div class="notice" id="status" hidden></div><div class="actions"><button type="button" class="btn primary" id="submit">Sign &amp; Submit SOA</button></div></div>`;const canvas=document.querySelector('#sig'),ctx=canvas.getContext('2d');let drawing=false,last=null,ink=false;canvas.onpointerdown=e=>{e.preventDefault();drawing=true;canvas.setPointerCapture(e.pointerId);last=point(canvas,e)};canvas.onpointermove=e=>{if(!drawing||!last)return;e.preventDefault();const n=point(canvas,e);ctx.strokeStyle='#111827';ctx.lineWidth=4;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(n.x,n.y);ctx.stroke();last=n;ink=true};const end=e=>{e?.preventDefault();drawing=false;last=null};canvas.onpointerup=end;canvas.onpointercancel=end;canvas.onpointerleave=end;document.querySelector('#clear').onclick=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);ink=false};document.querySelector('#submit').onclick=async e=>{const status=document.querySelector('#status'),button=e.currentTarget;status.hidden=false;status.classList.remove('error');try{if(!data.appointment_date)throw new Error('This SOA is missing the appointment date. Please contact your agent for a corrected link.');if(!data.coverage_year)throw new Error('This SOA is missing the coverage year. Please contact your agent for a corrected link.');if(!document.querySelector('#agree').checked)throw new Error('Please confirm the beneficiary acknowledgement before signing.');if(!ink)throw new Error('Please sign in the signature box.');button.disabled=true;status.textContent='Saving your signed Scope of Appointment…';const blob=await buildPng(data,canvas),base64=await blobBase64(blob);const response=await fetch(`${ENDPOINT}?token=${encodeURIComponent(token)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({signature_png_base64:base64})});const result=await response.json();if(!response.ok)throw new Error(result.error||'Unable to save signed SOA.');app.innerHTML=`${header()}<div class="success"><h2>Thank you — your SOA is signed</h2><p>Your signed Scope of Appointment has been securely returned to Platinum Financial.</p></div>`}catch(err){status.textContent=err.message||'Unable to submit SOA.';status.classList.add('error');button.disabled=false}}}
load();
</script>
</body>
</html>
